name: kainato_portfolio
description: "Portfólio de Caio Calado, desenvolvedor Flutter sênior."
publish_to: "none"
version: 2.0.0

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.1.0
  go_router: ^17.5.0
  flutter_markdown_plus: ^1.0.12
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/home/
    - assets/projects/
    - assets/sounds/

scripts:
  build_web: flutter build web # Cria o aplicativo na versão web
  docs: mkdir docs # Cria o diretório onde será armazenado o código fonte web do projeto
  copy: xcopy /E /H /Y build\web\* docs\ # Copia todo o conteúdo para a pasta de documentos.
